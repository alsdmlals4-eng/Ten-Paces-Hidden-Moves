name: Apply Observation Canon Files

on:
  push:
    branches:
      - agent/2026-08-05-wrong-plan-rescue-stat-derived-design
    paths:
      - .github/observation-canon-files.tar.gz.b64
      - .github/workflows/apply-observation-canon-files.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/2026-08-05-wrong-plan-rescue-stat-derived-design
          fetch-depth: 0

      - name: Validate and extract verified files
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/observation-canon-files.tar.gz.b64 > /tmp/observation-canon-files.tar.gz
          cat > /tmp/expected-files.txt <<'EOF'
          [기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md
          [기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md
          [기획서]/00_프로젝트_허브/DOCUMENTATION_MAP.md
          [기획서]/00_프로젝트_허브/START_HERE.md
          docs/01_GAME_DESIGN.md
          docs/02_COMBAT_RULES.md
          docs/04_ROADMAP.md
          docs/06_STARTING_FACTION_MASTERY_DATA.md
          docs/BASE_RULES_VERSION.md
          docs/CANON_LIFECYCLE_REGISTRY.md
          tools/check_postmerge_canon_lifecycle.py
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt
          tar -tzf /tmp/observation-canon-files.tar.gz | sort > /tmp/actual-files.txt
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          tar -xzf /tmp/observation-canon-files.tar.gz -C .
          rm .github/observation-canon-files.tar.gz.b64
          rm .github/workflows/apply-observation-canon-files.yml

      - name: Verify focused contracts
        run: |
          python -m unittest tests.test_postmerge_canon_lifecycle tests.test_observation_answer_leak_guardrails_contract tests.test_wrong_plan_rescue_derived_stats_contract tests.test_condition_calibration_contract tests.test_work_governance_contract -v
          python tools/check_project_operating_system.py --root . --config .github/documentation-governance.json
          python tools/check_canonical_reference_freshness.py --root . --config .github/reference-freshness.json

      - name: Commit canon repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: retain direct observation reveal and repair canon freshness"
          git push origin HEAD:agent/2026-08-05-wrong-plan-rescue-stat-derived-design
