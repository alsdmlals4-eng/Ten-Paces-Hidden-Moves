name: Synchronize Ten Manual Current Authority

on:
  pull_request:
    paths:
      - .github/workflows/sync-ten-manual-current-authority.yml
  push:
    branches:
      - agent/2026-08-05-wrong-plan-rescue-stat-derived-design
    paths:
      - .github/workflows/sync-ten-manual-current-authority.yml

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize authority documents and validators
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one occurrence, found {count}")
              return text.replace(old, new, 1)

          active_path = "[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md"
          active = read(active_path)
          active = replace_once(
              active,
              "> 현재 7성·9성 숙련 예산 권위: `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01`  \n",
              "> 현재 7성·9성 숙련 예산 부모 권위: `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01`  \n> 현재 초기 무공서 10권 성장 권위: `TEN-DEC-20260806-TEN-RECOGNIZABLE-MARTIAL-MANUALS-FULL-GROWTH-01`  \n",
              "active authority header",
          )
          active = replace_once(active, "active_approval_count: 10/10", "active_approval_count: 9/10", "active count")
          active = replace_once(active, "active_decision_state: APPROVED_DRAFT_STAR7_STAR9_MASTERY_BONUS", "active_decision_state: APPROVED_DRAFT_TEN_RECOGNIZABLE_MARTIAL_MANUALS", "active state")
          active = replace_once(active, "next_planning_decision: SIX_STAR7_MASTERY_BONUS_ALLOCATIONS", "next_planning_decision: TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE", "active next")
          active = replace_once(active, "## 현재 승인 계보 — 10/10", "## 이전 승인 계보 — 10/10", "active lineage heading")
          active = replace_once(
              active,
              "10. `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01`\n\n지원 권위:",
              "10. `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01`\n\n## 현재 승인 배치 — 9/10\n\n- `TEN-DEC-20260806-TEN-RECOGNIZABLE-MARTIAL-MANUALS-FULL-GROWTH-01`\n- 초기 10권의 문파·이름·주/보조능력치 적합성·3/5/7/9/10성 성장·예산을 승인한다.\n- 능력치별 권수·균등 분포·쿼터는 설계 규칙으로 사용하지 않는다.\n- 런타임 구현은 `TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE` 전까지 금지한다.\n\n지원 권위:",
              "active current batch",
          )
          active = replace_once(
              active,
              "- 7성 기술2는 현행 repricing 유효 예산에 숙련 보너스 `+10틱`을 받지만 실제 배분은 다음 Decision까지 미승인이다.\n- 9성 추가 예산은 `10 + floor(7성 최종 예산×0.20)`이며 단일 효과·무분기·추가입력/비용 없음이다.",
              "- 기존 6권 기술2는 현행 repricing 유효 예산에 `+10틱`을 통합하고, 신규 4권 기술2는 새 승인 예산 프로필을 사용한다.\n- 초기 10권의 9성은 `10 + floor(7성 최종 예산×0.20)` 안에서 단일 효과·무분기·추가입력/비용 없음으로 승인됐다.\n- 초기 10권의 10성 절초는 각각 고유 해결 순서와 `±5틱` 계획 예산을 가진다.\n- 주·보조능력치 권수 분포는 검사하지 않고 문파·무학·동작·피해 방식 적합성만 검사한다.",
              "active current summary",
          )
          active = replace_once(
              active,
              "- `[현행]`: 전투 가격·repricing·기술1·7/9성 숙련 예산·자원 포화·조건 보정·파생 스탯·오판 구제·관찰 직접 공개·등급 파밍 방지·작업 운영 정책.",
              "- `[현행]`: 초기 무공서 10권 성장·전투 가격·repricing·기술1·7/9성 예산 부모·자원 포화·조건 보정·파생 스탯·오판 구제·관찰 직접 공개·등급 파밍 방지·작업 운영 정책.",
              "active lifecycle",
          )
          old_gate = """```text
SIX_STAR7_MASTERY_BONUS_ALLOCATIONS
→ SIX_STAR9_SINGLE_COMPLETION_BONUSES
→ SIX_STAR10_UNIQUE_ULTIMATES
→ NON_STAT_NODE_EXPECTED_VALUE_AND_WEIGHT
→ FULL_CORE_FUN_CANON_ADVERSARIAL_REVIEW
→ [기획 완료]
→ 이미지·애니메이션·HX 승인
→ [이미지 완료]
→ VERTICAL_SLICE_APP_FLOW_SHELL Codex BUILD
```

10/10 체크포인트이므로 새 승인 배치를 열기 전 현재 PR 계보·정본·Sheet의 일치를 먼저 검토한다."""
          new_gate = """```text
TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE
→ RED 런타임 계약·회귀 검사
→ Godot 데이터·카드·해결기 구현
→ 사람·밸런스 검증
→ NON_STAT_NODE_EXPECTED_VALUE_AND_WEIGHT
→ FULL_CORE_FUN_CANON_ADVERSARIAL_REVIEW
```

현재 승인 배치는 9/10이다. GitHub·Google Sheet 정본 동기화 뒤 런타임 구현은 별도 승인 Gate에서 시작한다."""
          active = replace_once(active, old_gate, new_gate, "active gate")
          active = replace_once(active, "planning_checkpoint: DRAFT_PR92_STAR7_STAR9_MASTERY_BONUS_10_OF_10", "planning_checkpoint: DRAFT_PR92_TEN_RECOGNIZABLE_MARTIAL_MANUALS_9_OF_10", "active checkpoint")
          write(active_path, active)

          roadmap_path = "docs/04_ROADMAP.md"
          roadmap = read(roadmap_path)
          roadmap = replace_once(
              roadmap,
              "> 7성·9성 숙련 예산: `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01`",
              "> 초기 무공서 10권 성장: `TEN-DEC-20260806-TEN-RECOGNIZABLE-MARTIAL-MANUALS-FULL-GROWTH-01`  \n> 7성·9성 예산 부모: `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01`",
              "roadmap authority header",
          )
          roadmap = replace_once(roadmap, "active_approval_count: 10/10", "active_approval_count: 9/10", "roadmap count")
          roadmap = replace_once(roadmap, "active_decision_state: APPROVED_DRAFT_STAR7_STAR9_MASTERY_BONUS", "active_decision_state: APPROVED_DRAFT_TEN_RECOGNIZABLE_MARTIAL_MANUALS", "roadmap state")
          roadmap = replace_once(roadmap, "next_planning_decision: SIX_STAR7_MASTERY_BONUS_ALLOCATIONS", "next_planning_decision: TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE", "roadmap next")
          roadmap = replace_once(
              roadmap,
              "- [x] 승인 배치10·조기 체크포인트·모든 작업 TDD·현업 벤치마킹.",
              "- [x] 승인 배치10·조기 체크포인트·모든 작업 TDD·현업 벤치마킹.\n- [x] 한국·중국 무협 인지도 기반 초기 무공서 10권과 문파 표시.\n- [x] 주·보조능력치 권수 쿼터 폐기와 무공별 적합성 근거.\n- [x] 10권의 3/5/7/9/10성 성장·절초·해결 순서·계획 예산.",
              "roadmap checklist",
          )
          old_order = """```text
SIX_STAR7_MASTERY_BONUS_ALLOCATIONS
→ SIX_STAR9_SINGLE_COMPLETION_BONUSES
→ SIX_STAR10_UNIQUE_ULTIMATES
→ NON_STAT_NODE_EXPECTED_VALUE_AND_WEIGHT
→ FULL_CORE_FUN_CANON_ADVERSARIAL_REVIEW
→ [기획 완료]
→ 이미지·애니메이션·HX 승인
→ [이미지 완료]
→ VERTICAL_SLICE_APP_FLOW_SHELL Codex BUILD
```

현재 배치는 10/10이다. 여섯 개별 7성 배분은 새 승인 배치에서 시작하며, 7성 배분 전에 9성 개별 효과를 작성하지 않는다."""
          new_order = """```text
TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE
→ RED 런타임 계약·회귀 검사
→ 10권 Godot 데이터·카드·해결기 구현
→ 사람·밸런스·가독성 검증
→ NON_STAT_NODE_EXPECTED_VALUE_AND_WEIGHT
→ FULL_CORE_FUN_CANON_ADVERSARIAL_REVIEW
```

현재 배치는 9/10이다. 초기 10권의 기획·예산은 승인됐지만 제품 런타임은 아직 변경하지 않는다."""
          roadmap = replace_once(roadmap, old_order, new_order, "roadmap order")
          roadmap = replace_once(
              roadmap,
              "- [ ] 여섯 7성 `+10틱` 효과 배분.\n- [ ] 여섯 9성 단일 완성 보너스.\n- [ ] 10성 절초와 비스탯 노드.",
              "- [x] 초기 10권 7성 기술2 효과와 통합 예산.\n- [x] 초기 10권 9성 단일 완성 효과.\n- [x] 초기 10권 10성 절초·해결 순서·계획 예산.\n- [ ] 10권 런타임 구현 Gate.\n- [ ] 비스탯 노드 기대값과 가중치.",
              "roadmap gates",
          )
          roadmap = replace_once(roadmap, "- 7성·9성 예산 overlay 적용과 개별 효과 승인 상태 확인.", "- 10권 의미 계약·예산 overlay·역사 alias 적용과 런타임 구현 Gate 확인.", "roadmap build gate")
          write(roadmap_path, roadmap)

          mastery_path = "docs/06_STARTING_FACTION_MASTERY_DATA.md"
          mastery = read(mastery_path)
          mastery = replace_once(mastery, "active_batch: 10/10", "active_batch: 9/10", "mastery batch")
          mastery = replace_once(mastery, "current_decision: TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01", "current_decision: TEN-DEC-20260806-TEN-RECOGNIZABLE-MARTIAL-MANUALS-FULL-GROWTH-01", "mastery decision")
          mastery = replace_once(mastery, "next_decision: SIX_STAR7_MASTERY_BONUS_ALLOCATIONS", "next_decision: TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE", "mastery next")
          mastery = replace_once(
              mastery,
              "현재 T0에는 세력 선택·수련 분기·개별 7성/9성 보너스 효과가 구현되지 않았다.",
              "초기 10권의 문파·3/5/7/9/10성 효과와 예산은 기획 승인됐지만 T0 제품 런타임에는 아직 구현되지 않았다.",
              "mastery runtime statement",
          )
          mastery = replace_once(
              mastery,
              "- 7성·9성 숙련 예산: `approved_20260805_star7_star9_mastery_bonus_contract.json`",
              "- 7성·9성 예산 부모: `approved_20260805_star7_star9_mastery_bonus_contract.json`\n- 초기 10권 의미·능력치 적합성·성급별 효과: `approved_20260806_ten_recognizable_martial_manuals_contract.json`\n- 초기 10권 기술2·절초 계획 예산: `approved_20260806_ten_manual_growth_budget_overlay_contract.json`\n- 플레이어용 목록: `docs/03_TEN_MARTIAL_MANUALS_CATALOG.md`",
              "mastery authorities",
          )
          mastery = replace_once(mastery, "개별 7성 +10틱 배분과 9성 효과는 아직 미승인이다.", "초기 10권의 7성 기술2·9성 단일 효과·10성 절초는 승인됐으며, 제품 런타임 구현은 별도 Gate까지 금지한다.", "mastery approval statement")
          mastery = replace_once(mastery, "## 세력 정체성 후보", "## 역사적 6권 역할표", "mastery history heading")
          mastery = replace_once(
              mastery,
              "이 표는 동일 역할 금지를 위한 책임 원본이다. 실제 +10틱 효과와 9성 단일 효과는 후속 Decision에서 확정한다.",
              "이 표는 구형 이름의 역할 계보를 추적하는 역사 자료다. 현재 표시명·문파·능력치·성장 효과는 2026-08-06 10권 계약과 카탈로그를 따른다.",
              "mastery history note",
          )
          mastery = replace_once(
              mastery,
              "현재 T0 런타임에는 공용 절초 3종이 역사 PoC 데이터로 존재한다. 시작 무공별 10성 절초는 주 영구 능력치12 요구만 승인됐고 개별 효과는 미승인이다.",
              "현재 T0 런타임에는 공용 절초 3종이 역사 PoC 데이터로 존재한다. 초기 10권의 고유 절초는 기획·예산 승인됐지만 런타임에는 아직 구현되지 않았다.",
              "mastery ultimates",
          )
          old_mastery_gate = """```text
SIX_STAR7_MASTERY_BONUS_ALLOCATIONS
→ SIX_STAR9_SINGLE_COMPLETION_BONUSES
→ SIX_STAR10_UNIQUE_ULTIMATES
→ NON_STAT_NODE_EXPECTED_VALUE_AND_WEIGHT
→ FULL_CORE_FUN_CANON_ADVERSARIAL_REVIEW
```"""
          new_mastery_gate = """```text
TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE
→ RED 런타임 계약·회귀 검사
→ 10권 Godot 데이터·카드·해결기 구현
→ 사람·밸런스 검증
→ NON_STAT_NODE_EXPECTED_VALUE_AND_WEIGHT
→ FULL_CORE_FUN_CANON_ADVERSARIAL_REVIEW
```"""
          mastery = replace_once(mastery, old_mastery_gate, new_mastery_gate, "mastery gate")
          write(mastery_path, mastery)

          registry_path = "docs/CANON_LIFECYCLE_REGISTRY.md"
          registry = read(registry_path)
          registry = replace_once(registry, "- 현행 성장 권위: `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01`", "- 현행 성장 권위: `TEN-DEC-20260806-TEN-RECOGNIZABLE-MARTIAL-MANUALS-FULL-GROWTH-01`\n- 7성·9성 예산 부모: `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01`", "registry header")
          registry = replace_once(
              registry,
              "| 7성·9성 숙련 예산 개정 | `docs/02_COMBAT_RULES_STAR7_STAR9_MASTERY_BONUS_AMENDMENT.md` |",
              "| 7성·9성 예산 부모 개정 | `docs/02_COMBAT_RULES_STAR7_STAR9_MASTERY_BONUS_AMENDMENT.md` |\n| 초기 무공서 10권 전투 해결 개정 | `docs/02_COMBAT_RULES_TEN_RECOGNIZABLE_MARTIAL_MANUALS_AMENDMENT.md` |\n| 초기 무공서 10권 읽기 카탈로그 | `docs/03_TEN_MARTIAL_MANUALS_CATALOG.md` |",
              "registry current table",
          )
          registry = replace_once(
              registry,
              "| 7성·9성 숙련 예산·단일 효과 템플릿 | `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01` |",
              "| 7성·9성 예산 부모·단일 효과 템플릿 | `TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01` |\n| 초기 10권 문파·능력치 적합성·3/5/7/9/10성 성장 | `TEN-DEC-20260806-TEN-RECOGNIZABLE-MARTIAL-MANUALS-FULL-GROWTH-01` |",
              "registry authority row",
          )
          registry = replace_once(
              registry,
              "- `approved_20260805_star7_star9_mastery_bonus_contract.json`\n- `approved_20260805_work_governance_contract.json`",
              "- `approved_20260805_star7_star9_mastery_bonus_contract.json`\n- `approved_20260806_ten_recognizable_martial_manuals_contract.json`\n- `approved_20260806_ten_manual_growth_budget_overlay_contract.json`\n- `approved_20260805_work_governance_contract.json`",
              "registry contracts",
          )
          registry = replace_once(
              registry,
              "| 여섯 7성 +10틱 실제 효과 배분 | 예산만 승인 | 새 승인 배치·개별 GrillMe |\n| 여섯 9성 단일 완성 효과 | 템플릿만 승인 | 7성 배분 뒤 개별 GrillMe |",
              "| 초기 10권 런타임 구현 | 기획·예산 승인, 제품 미구현 | `TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE` 승인 |",
              "registry held rows",
          )
          registry = replace_once(
              registry,
              "| #92 | Draft·부모 #91·파생 스탯·오판 구제·관찰·등급·7/9성 숙련 예산·10/10 |",
              "| #92 | Draft·부모 #91·파생 스탯·관찰·등급·7/9성 예산 부모·초기 무공서 10권·현재 배치9/10 |",
              "registry PR row",
          )
          registry = replace_once(
              registry,
              "- 별도 Decision 전에 여섯 개별 7성/9성 효과를 승인 또는 런타임 생성.",
              "- 2026-08-06 계약을 무시하고 구형 6권 이름·능력치·미승인 상태를 현행으로 사용.\n- 능력치별 무공서 권수·균등 분포·쿼터를 강제해 문파·무학 적합성을 왜곡.\n- `TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE` 전에 10권 제품 런타임 데이터를 생성.",
              "registry conflicts",
          )
          old_registry_gate = """`SIX_STAR7_MASTERY_BONUS_ALLOCATIONS`가 다음 Decision이다. 현재 승인 배치는 `10/10`으로 닫혔다.

```text
SIX_STAR7_MASTERY_BONUS_ALLOCATIONS
→ SIX_STAR9_SINGLE_COMPLETION_BONUSES
→ SIX_STAR10_UNIQUE_ULTIMATES
→ NON_STAT_NODE_EXPECTED_VALUE_AND_WEIGHT
→ FULL_CORE_FUN_CANON_ADVERSARIAL_REVIEW
```

여섯 개별 7성 효과와 9성 효과를 현재 권위로 사용하면 안 된다. 자동 조정 없이 새 GrillMe Decision으로만 승인한다."""
          new_registry_gate = """`TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE`가 다음 Decision이다. 현재 승인 배치는 `9/10`이다.

```text
TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE
→ RED 런타임 계약·회귀 검사
→ 10권 제품 데이터·카드·해결기 구현
→ 사람·밸런스 검증
→ NON_STAT_NODE_EXPECTED_VALUE_AND_WEIGHT
→ FULL_CORE_FUN_CANON_ADVERSARIAL_REVIEW
```

기획 승인만으로 제품 코드·Godot Scene·런타임 데이터 구현 완료를 주장하면 안 된다."""
          registry = replace_once(registry, old_registry_gate, new_registry_gate, "registry gate")
          write(registry_path, registry)

          validator_path = "tools/check_postmerge_canon_lifecycle.py"
          validator = read(validator_path)
          validator = replace_once(validator, 'active_state["active_approval_count"] == "10/10"', 'active_state["active_approval_count"] == "9/10"', "validator count")
          validator = replace_once(validator, 'active_state["active_decision_state"] == "APPROVED_DRAFT_STAR7_STAR9_MASTERY_BONUS"', 'active_state["active_decision_state"] == "APPROVED_DRAFT_TEN_RECOGNIZABLE_MARTIAL_MANUALS"', "validator state")
          validator = replace_once(validator, 'active_state["next_planning_decision"] == "SIX_STAR7_MASTERY_BONUS_ALLOCATIONS"', 'active_state["next_planning_decision"] == "TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE"', "validator next")
          validator = replace_once(validator, '"TEN-DEC-20260805-STAR7-STAR9-MASTERY-BONUS-01",\n        "DRAFT_PR92_STAR7_STAR9_MASTERY_BONUS_10_OF_10",', '"TEN-DEC-20260806-TEN-RECOGNIZABLE-MARTIAL-MANUALS-FULL-GROWTH-01",\n        "DRAFT_PR92_TEN_RECOGNIZABLE_MARTIAL_MANUALS_9_OF_10",', "validator active tokens")
          validator = replace_once(validator, '"SIX_STAR7_MASTERY_BONUS_ALLOCATIONS",\n        "SIX_STAR9_SINGLE_COMPLETION_BONUSES",', '"TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE",\n        "NON_STAT_NODE_EXPECTED_VALUE_AND_WEIGHT",', "validator roadmap tokens")
          validator = replace_once(validator, '"approved_20260805_star7_star9_mastery_bonus_contract.json",\n        "SIX_STAR7_MASTERY_BONUS_ALLOCATIONS",', '"approved_20260806_ten_recognizable_martial_manuals_contract.json",\n        "approved_20260806_ten_manual_growth_budget_overlay_contract.json",\n        "TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE",', "validator registry tokens")
          validator = replace_once(validator, '"active_batch: 10/10",', '"active_batch: 9/10",', "validator mastery batch token")
          validator = replace_once(validator, '"SIX_STAR7_MASTERY_BONUS_ALLOCATIONS",', '"approved_20260806_ten_recognizable_martial_manuals_contract.json",\n        "approved_20260806_ten_manual_growth_budget_overlay_contract.json",\n        "TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE",', "validator mastery next token")
          validator = replace_once(validator, 'require("active_batch: 9/10" not in mastery, "growth authority still claims active batch 9/10")', 'require("active_batch: 10/10" not in mastery, "growth authority still claims the superseded active batch 10/10")', "validator mastery negative")
          write(validator_path, validator)

          old_test_path = "tests/test_star7_star9_mastery_bonus_contract.py"
          old_test = read(old_test_path)
          pattern = re.compile(r"    def test_current_canon_moves_to_ten_of_ten\(self\):.*?(?=\n    def test_rejects_star7_bonus_drift)", re.S)
          replacement = '''    def test_later_ten_manual_decision_owns_current_canon(self):
              active = (ROOT / "[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md").read_text(encoding="utf-8")
              roadmap = (ROOT / "docs/04_ROADMAP.md").read_text(encoding="utf-8")
              mastery = (ROOT / "docs/06_STARTING_FACTION_MASTERY_DATA.md").read_text(encoding="utf-8")
              for text in [active, roadmap]:
                  self.assertIn("active_approval_count: 9/10", text)
                  self.assertIn("active_decision_state: APPROVED_DRAFT_TEN_RECOGNIZABLE_MARTIAL_MANUALS", text)
                  self.assertIn("next_planning_decision: TEN_MANUAL_RUNTIME_IMPLEMENTATION_GATE", text)
              self.assertIn("active_batch: 9/10", mastery)
              self.assertIn("approved_20260806_ten_recognizable_martial_manuals_contract.json", mastery)
              self.assertIn("approved_20260806_ten_manual_growth_budget_overlay_contract.json", mastery)
              self.assertNotIn("active_batch: 10/10", mastery)
          '''
          old_test, count = pattern.subn(replacement.rstrip(), old_test)
          if count != 1:
              raise SystemExit(f"star7 current-state test: expected one block, found {count}")
          write(old_test_path, old_test)

          workflow_path = ".github/workflows/documentation-governance.yml"
          workflow = read(workflow_path)
          anchor = """      - name: Validate Star7 Star9 mastery bonus contract
