name: Synchronize Ten Manual Current Authority

on:
  pull_request:
    paths:
      - .github/workflows/sync-ten-manual-current-authority.yml
      - tools/sync_ten_manual_current_authority.py
  push:
    branches:
      - agent/2026-08-05-wrong-plan-rescue-stat-derived-design
    paths:
      - .github/workflows/sync-ten-manual-current-authority.yml
      - tools/sync_ten_manual_current_authority.py

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Synchronize authority documents and validators
        run: python tools/sync_ten_manual_current_authority.py
      - name: Commit synchronized current authority
        run: |
          git checkout -- .github/workflows/documentation-governance.yml
          if git diff --quiet; then
            echo "Already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' \
                  docs/04_ROADMAP.md \
                  docs/06_STARTING_FACTION_MASTERY_DATA.md \
                  docs/CANON_LIFECYCLE_REGISTRY.md \
                  tools/check_postmerge_canon_lifecycle.py \
                  tests/test_star7_star9_mastery_bonus_contract.py
          git commit -m "docs: synchronize ten-manual current authority"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
