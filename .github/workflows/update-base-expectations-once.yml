name: Update Base Expectations Once
on:
  pull_request:
    branches: [main]
    paths: ["tools/update_base_expectations_once.py", ".github/workflows/update-base-expectations-once.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/update_base_expectations_once.py
      - run: |
          python -m json.tool .github/reference-freshness.json >/dev/null
          python -m unittest tests.test_bca_visual_sheet_adoption -v
          git diff --check
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/BASE_RULES_VERSION.md .github/reference-freshness.json
          git commit -m "docs: align current Base expectations"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
