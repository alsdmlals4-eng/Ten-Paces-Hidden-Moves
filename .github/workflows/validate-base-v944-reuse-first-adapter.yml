name: Validate Base v9.4.4 Reuse First Adapter

on:
  pull_request:
    paths:
      - "skills/PROJECT_BASE_ADAPTER.json"
      - "docs/operations/2026-09-01_BASE_CURRENT_ADAPTER_WORK_CONTRACT_RECEIPT.json"
      - "tests/test_base_v944_reuse_first_adoption.py"
      - "tests/test_base_current_work_contract_adaptation.py"
      - ".github/workflows/validate-base-v944-reuse-first-adapter.yml"
      - ".github/workflows/validate-project-base-adapter.yml"

permissions:
  contents: read

jobs:
  adapter-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run Base v9.4.4 adapter and current-work contract regressions
        run: python -m unittest tests.test_base_v944_reuse_first_adoption tests.test_base_current_work_contract_adaptation -v
