name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: scope-aware-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false

      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.txt
          if grep -Eq '^(project\.godot|data/|src/|scenes/|assets/|addons/|tests/.*\.(gd|py)$|tools/.*\.(ps1|cmd)$|\.github/workflows/)' changed-files.txt; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run GUT, HiGodot, conflict-marker, and work-entry contracts
        run: >-
          python -m unittest
          tests.test_gut_higodot_adoption
          tests.test_conflict_marker_detection
          tests.test_work_entry_completeness_gate
          -v

      - name: Enforce work-entry completeness gate
        run: python tools/check_work_entry_completeness_gate.py

      - name: Validate project operating system
        run: python tools/check_project_operating_system.py --root . --config .github/documentation-governance.json

      - name: Validate canonical reference freshness
        run: python tools/check_canonical_reference_freshness.py --root . --config .github/reference-freshness.json

      - name: Validate Skill package integrity
        run: python tools/check_skill_package_integrity.py

      - name: Validate archive retention governance
        run: python tools/check_archive_governance.py

      - name: Run archive retention regression tests
        run: python -m unittest tests.test_archive_retention_governance -v

      - name: Run governance regression tests
        run: python -m unittest discover -s tests -p 'test_project_governance.py'

      - name: Run post-merge canon lifecycle regression tests
        run: python -m unittest tests.test_postmerge_canon_lifecycle -v

      - name: Validate post-merge canon lifecycle
        run: python tools/check_postmerge_canon_lifecycle.py

      - name: Run condition calibration regression tests
        run: python -m unittest tests.test_condition_calibration_contract -v

      - name: Validate condition calibration contract
        run: python tools/check_condition_calibration_contract.py

      - name: Run work governance regression tests
        run: python -m unittest tests.test_work_governance_contract -v

      - name: Validate work governance contract
        run: python tools/check_work_governance_contract.py

      - name: Run wrong-plan rescue derived stats regression tests
        run: python -m unittest tests.test_wrong_plan_rescue_derived_stats_contract -v

      - name: Validate wrong-plan rescue derived stats contract
        run: python tools/check_wrong_plan_rescue_derived_stats_contract.py

      - name: Run observation guardrail regression tests
        run: python -m unittest tests.test_observation_answer_leak_guardrails_contract -v

      - name: Validate observation guardrail contract
        run: python tools/check_observation_answer_leak_guardrails_contract.py

      - name: Run grade-farming guardrail regression tests
        run: python -m unittest tests.test_grade_farming_guardrails_contract -v

      - name: Validate grade-farming guardrail contract
        run: python tools/check_grade_farming_guardrails_contract.py

      - name: Run Star7 Star9 mastery bonus regression tests
        run: python -m unittest tests.test_star7_star9_mastery_bonus_contract -v

      - name: Validate Star7 Star9 mastery bonus contract
        run: python tools/check_star7_star9_mastery_bonus_contract.py

      - name: Run ten-manual semantic regression tests
        run: python -m unittest tests.test_ten_recognizable_martial_manuals_contract -v

      - name: Validate ten-manual semantic contract
        run: python tools/check_ten_recognizable_martial_manuals_contract.py

      - name: Run ten-manual budget regression tests
        run: python -m unittest tests.test_ten_manual_growth_budget_overlay -v

      - name: Validate ten-manual budget overlay
        run: python tools/check_ten_manual_growth_budget_overlay.py

      - name: Validate PoC planning data
        run: python -m unittest tests.test_poc_planning_data -v

      - name: Validate canonical combat impact map
        run: python tests/check_canonical_combat_docs.py

      - name: Validate card component contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_card_component_contract.py

      - name: Validate combat contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_combat_board_contract.py

      - name: Validate rival tendency contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_rival_tendency_contract.py

      - name: Validate A2 hypothesis and summary contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_repeat_poc_a2_contract.py

      - name: Validate A3 review UI contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_repeat_poc_a3_contract.py

      - name: Validate prepare and auto placement contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_prepare_auto_placement_contract.py

      - name: Validate action selection contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_action_selection_contract.py

      - name: Parse PowerShell automations for code changes
        if: steps.scope.outputs.code_changed == 'true'
        shell: pwsh
        run: |
          $paths = @(
            "tools/verify_and_commit_step0.ps1",
            "tools/verify_and_commit_combat_foundation.ps1",
            "tools/run_combat_board.ps1",
            "tools/verify_repeat_poc_a1.ps1",
            "tools/verify_repeat_poc_a2.ps1",
            "tools/verify_repeat_poc_a3.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: Record deferred runtime boundary
        if: steps.scope.outputs.code_changed == 'true' && vars.ACTIONS_FULL_VALIDATION_ENABLED != 'true'
        run: echo "Godot and OS/Python matrix checks require Full Validation evidence."

  gut-adoption-exact-head:
    name: gut-adoption-exact-head
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          show-progress: false
      - name: Require exact PR head
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact-head adoption contracts
        run: >-
          python -m unittest
          tests.test_gut_higodot_adoption
          tests.test_conflict_marker_detection
          tests.test_work_entry_completeness_gate
          -v
      - name: Enforce exact-head work-entry gate
        run: python tools/check_work_entry_completeness_gate.py
      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Prepare GUT JUnit directory
        run: mkdir -p build/test-results
      - name: Run GUT project tests
        run: >-
          godot --headless --path . --script res://addons/gut/gut_cmdln.gd
          -gconfig=res://.gutconfig.json
      - name: Require JUnit output
        if: always()
        run: test -f build/test-results/gut.xml
      - name: Upload exact-head GUT JUnit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gut-junit-${{ github.run_id }}
          path: build/test-results/gut.xml
          if-no-files-found: error
          retention-days: 14
