name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    name: scope-aware-validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
          ref: ${{ github.head_ref }}

      - name: Apply approved REVIEW remediation
        if: ${{ hashFiles('.review-build-remediation/part-00') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          cat .review-build-remediation/part-* > /tmp/review-build-remediation.b64
          base64 --decode /tmp/review-build-remediation.b64 > /tmp/review-build-remediation.tar.xz
          echo "9d52d7a4954894a6c9599c574c76ffb5c7283692f980a6ad6873e5a14c31a627  /tmp/review-build-remediation.tar.xz" | sha256sum --check --strict
          tar -xJf /tmp/review-build-remediation.tar.xz
          git checkout HEAD -- .github/workflows/documentation-governance.yml
          rm -rf .review-build-remediation
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "review: apply approved adversarial remediation"
          git push origin HEAD:"${{ github.head_ref }}"

      - name: Upload REVIEW build source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: review-build-source-${{ github.sha }}
          retention-days: 1
          if-no-files-found: error
          path: |
            AGENTS.md
            README.md
            START_HERE.md
            .github/reference-freshness.json
            .github/documentation-governance.json
            .github/workflows/documentation-governance.yml
            [기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md
            [기획서]/00_프로젝트_허브/DOCUMENTATION_MAP.md
            [기획서]/00_프로젝트_허브/HANDOFF.md
            [기획서]/DESIGN_DOCUMENT_REGISTRY.json
            docs/**
            tests/test_poc_planning_data.py
            tools/check_poc_planning_data.py

      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.txt
          if grep -Eq '^(project\.godot|data/|src/|scenes/|assets/|addons/|tests/.*\.(gd|py)$|tools/.*\.(ps1|cmd)$|\.github/workflows/)' changed-files.txt; then
            echo "code_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "code_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate project operating system
        run: python tools/check_project_operating_system.py --root . --config .github/documentation-governance.json

      - name: Validate canonical reference freshness
        run: python tools/check_canonical_reference_freshness.py --root . --config .github/reference-freshness.json

      - name: Validate Skill package integrity
        run: python tools/check_skill_package_integrity.py

      - name: Validate archive retention governance
        run: python tools/check_archive_governance.py

      - name: Run archive retention regression tests
        run: python -m unittest tests.test_archive_retention_governance -v

      - name: Run governance regression tests
        run: python -m unittest discover -s tests -p 'test_project_governance.py'

      - name: Validate PoC planning data
        run: python -m unittest tests.test_poc_planning_data -v

      - name: Validate canonical combat impact map
        run: python tests/check_canonical_combat_docs.py

      - name: Validate card component contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_card_component_contract.py

      - name: Validate combat contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_combat_board_contract.py

      - name: Validate rival tendency contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_rival_tendency_contract.py

      - name: Validate A2 hypothesis and summary contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_repeat_poc_a2_contract.py

      - name: Validate A3 review UI contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_repeat_poc_a3_contract.py

      - name: Validate prepare and auto placement contract
        if: steps.scope.outputs.code_changed == 'true'
        run: python tests/check_prepare_auto_placement_contract.py

      - name: Parse PowerShell automations for code changes
        if: steps.scope.outputs.code_changed == 'true'
        shell: pwsh
        run: |
          $paths = @(
            "tools/verify_and_commit_step0.ps1",
            "tools/verify_and_commit_combat_foundation.ps1",
            "tools/run_combat_board.ps1",
            "tools/verify_repeat_poc_a1.ps1",
            "tools/verify_repeat_poc_a2.ps1",
            "tools/verify_repeat_poc_a3.ps1"
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          }

      - name: Record deferred runtime boundary
        if: steps.scope.outputs.code_changed == 'true' && vars.ACTIONS_FULL_VALIDATION_ENABLED != 'true'
        run: echo "Godot and OS/Python matrix checks require Full Validation evidence."
