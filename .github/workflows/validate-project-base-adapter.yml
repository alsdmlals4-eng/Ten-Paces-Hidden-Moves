name: Validate Project Base Adapter

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check out Base validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: alsdmlals4-eng/Base
          ref: 2828a74f60c1ed09546171040f4178c8848ea686
          path: .base-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Select the trusted protected baseline
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ADAPTER_PATH="skills/PROJECT_BASE_ADAPTER.json"
          APPROVAL_PATH="docs/operations/PROJECT_PROTECTED_CHANGE_APPROVAL.json"
          PR_BASELINE_SHA="$(
            git show "$PR_BASE_SHA:$ADAPTER_PATH" |
              python -c 'import json, sys; payload = json.load(sys.stdin); print(payload["protected_baseline"]["commit"])'
          )"
          HEAD_BASELINE_SHA="$(
            git show "HEAD:$ADAPTER_PATH" |
              python -c 'import json, sys; payload = json.load(sys.stdin); print(payload["protected_baseline"]["commit"])'
          )"
          ACTIVE_APPROVAL_NEW_IN_PR=false
          if [ -f "$APPROVAL_PATH" ] && ! git cat-file -e "$PR_BASE_SHA:$APPROVAL_PATH" 2>/dev/null; then
            ACTIVE_APPROVAL_NEW_IN_PR=true
          fi
          if [ "$ACTIVE_APPROVAL_NEW_IN_PR" = true ] || [ "$HEAD_BASELINE_SHA" != "$PR_BASELINE_SHA" ]; then
            PROTECTED_BASE_SHA="$PR_BASE_SHA"
          else
            PROTECTED_BASE_SHA="$PR_BASELINE_SHA"
          fi
          python -c 'import re, sys; value = sys.argv[1]; raise SystemExit(0 if re.fullmatch(r"[0-9a-f]{40}", value) else 1)' "$PROTECTED_BASE_SHA"
          git cat-file -e "$PROTECTED_BASE_SHA^{commit}"
          git merge-base --is-ancestor "$PROTECTED_BASE_SHA" "$PR_BASE_SHA"
          printf 'PROTECTED_BASE_SHA=%s\n' "$PROTECTED_BASE_SHA" >> "$GITHUB_ENV"

      - name: Enforce one-time protected approval lifecycle
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python tools/check_one_time_protected_change_lifecycle.py \
            --project-root . \
            --base-sha "$PR_BASE_SHA"

      - name: Validate adapter and exact protected change approval
        env:
          EXTERNAL_APPROVAL: ${{ contains(github.event.pull_request.labels.*.name, 'approved-protected-change') }}
        run: |
          set -euo pipefail
          APPROVAL_PATH="docs/operations/PROJECT_PROTECTED_CHANGE_APPROVAL.json"
          APPROVAL_ARGS=()
          if [ -f "$APPROVAL_PATH" ]; then
            APPROVAL_ARGS=(--approval "$APPROVAL_PATH")
          fi
          python .base-contract/tools/check_approved_project_operating_contract.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PROTECTED_BASE_SHA" \
            --external-approval "$EXTERNAL_APPROVAL" \
            "${APPROVAL_ARGS[@]}" \
            --check

      - name: Diagnose generated view drift
        if: failure()
        run: |
          set -euo pipefail
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('.base-contract/tools').resolve()))
          import project_operating_contract as contract
          from base_release_index import install_release_lock_paths
          install_release_lock_paths(contract)
          root = Path('.').resolve()
          base = Path('.base-contract').resolve()
          artifacts = contract.build_artifacts(root, base, prevalidated=True)
          for path, content in artifacts.items():
              if not path.is_file() or path.read_bytes() != content:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
          PY
          sha256sum skills/PROJECT_BASE_ADAPTER.json
          git diff -- \
            skills/PROJECT_SKILL_SNAPSHOT.json \
            docs/PROJECT_OPERATING_DASHBOARD.html \
            skills/BASE_V9_ADAPTER.json \
            skills/PROJECT_BASE_SKILL_ADAPTER.json \
            .agents/skills/ten-paces-hidden-moves-workflow-router/SKILL.md

      - name: Run workflow adoption regression test
        run: python -m unittest tests.test_approved_protected_change_workflow -v
