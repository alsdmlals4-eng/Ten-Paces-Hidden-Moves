name: Temporary Generate Project Operating Artifacts

on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check out trusted Base validator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: bfdc9e44d4a6920dc085eaa3f9d19d31b1acd2a1
          path: .base-contract
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Generate canonical derived artifacts
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base "$PR_BASE_SHA" \
            --write
          git diff --name-only --diff-filter=ACMRT > generated-files.txt
          python - <<'PY'
          from pathlib import Path
          import tarfile

          files = [line for line in Path("generated-files.txt").read_text(encoding="utf-8").splitlines() if line]
          if not files:
              raise SystemExit("generator produced no changed artifacts")
          with tarfile.open("generated-operating-artifacts.tar.gz", "w:gz") as archive:
              for value in files:
                  path = Path(value)
                  if path.is_file():
                      archive.add(path, arcname=value)
          print("\n".join(files))
          PY

      - name: Upload generated artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ten-paces-project-operating-artifacts-${{ github.event.pull_request.head.sha }}
          path: |
            generated-operating-artifacts.tar.gz
            generated-files.txt
          if-no-files-found: error
          retention-days: 1
