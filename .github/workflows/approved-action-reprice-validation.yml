name: Validate approved action repricing

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/planning-data/approved_20260804_existing_action_reprice_contract.json"
      - "docs/decisions/2026-08-04_EXISTING_APPROVED_ACTIONS_REPRICE_DECISION.md"
      - "tools/check_existing_action_reprice_contract.py"
      - "tests/test_existing_action_reprice_contract.py"
      - ".github/workflows/approved-action-reprice-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run repricing regression tests
        run: python -m unittest tests.test_existing_action_reprice_contract -v
      - name: Validate approved repricing contract
        run: python tools/check_existing_action_reprice_contract.py --root .
