name: Repair Stable Operating Token Compatibility

on:
  push:
    branches:
      - agent/2026-08-05-wrong-plan-rescue-stat-derived-design
    paths:
      - .github/workflows/fix-stable-operating-token-compat.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/2026-08-05-wrong-plan-rescue-stat-derived-design
          fetch-depth: 0

      - name: Restore stable compatibility tokens
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path("AGENTS.md"),
              Path("START_HERE.md"),
              Path("README.md"),
              Path("[기획서]/00_프로젝트_허브/START_HERE.md"),
              Path("[기획서]/00_프로젝트_허브/DEVELOPMENT_GATES.md"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              if "work_mode: REVIEW" not in text:
                  marker = "product_stage: VERTICAL_SLICE_APP_FLOW_PLANNING\n"
                  if marker not in text:
                      raise SystemExit(f"missing product stage marker: {path}")
                  text = text.replace(marker, marker + "work_mode: REVIEW\nintegration_pr: 65\n", 1)
              elif "integration_pr: 65" not in text:
                  text = text.replace("work_mode: REVIEW\n", "work_mode: REVIEW\nintegration_pr: 65\n", 1)
              path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/fix-stable-operating-token-compat.yml")
          workflow.unlink()

      - name: Verify governance and observation contracts
        run: |
          python -m unittest tests.test_project_governance tests.test_observation_answer_leak_guardrails_contract -v
          python tools/check_project_operating_system.py --root . --config .github/documentation-governance.json
          python tools/check_canonical_reference_freshness.py --root . --config .github/reference-freshness.json

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: preserve stable operating-state compatibility tokens"
          git push origin HEAD:agent/2026-08-05-wrong-plan-rescue-stat-derived-design
