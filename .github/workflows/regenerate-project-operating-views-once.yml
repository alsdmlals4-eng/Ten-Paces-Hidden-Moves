name: Regenerate Project Operating Views Once

on:
  push:
    branches:
      - reconcile/archive-active-toolchain-approval
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Check out exact Base generator
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: alsdmlals4-eng/Base
          ref: 4ec410e611152294f3f2685570fca6019c7abcfa
          path: .base-contract
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install Base generator dependencies
        run: python -m pip install -r .base-contract/.github/validation-requirements.txt

      - name: Generate deterministic project operating views
        run: |
          python .base-contract/tools/build_project_operating_artifacts.py \
            --project-root . \
            --base-repository .base-contract \
            --protected-base 00a5502f1e40db77dce9495a57292b77bf4e3a5a \
            --write

      - name: Fail closed on unexpected generated paths
        shell: python
        run: |
          import subprocess
          from pathlib import Path

          expected = {
              "skills/PROJECT_SKILL_SNAPSHOT.json",
              "docs/PROJECT_OPERATING_DASHBOARD.html",
              "skills/BASE_V9_ADAPTER.json",
              "skills/PROJECT_BASE_SKILL_ADAPTER.json",
          }
          output = subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True,
              encoding="utf-8",
          )
          changed = {
              line[3:].replace("\\", "/")
              for line in output.splitlines()
              if line and not line[3:].startswith(".base-contract/")
          }
          print("Generated changed paths:", sorted(changed))
          if changed != expected:
              raise SystemExit(
                  "Unexpected generator delta. "
                  f"expected={sorted(expected)} actual={sorted(changed)}"
              )

      - name: Commit generated views to this recovery branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            skills/PROJECT_SKILL_SNAPSHOT.json \
            docs/PROJECT_OPERATING_DASHBOARD.html \
            skills/BASE_V9_ADAPTER.json \
            skills/PROJECT_BASE_SKILL_ADAPTER.json
          git commit -m "chore: regenerate project operating views"
          git push origin HEAD:reconcile/archive-active-toolchain-approval
