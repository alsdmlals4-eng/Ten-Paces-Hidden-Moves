name: Sync Base v9.4 Reference Freshness

on:
  pull_request:
    paths:
      - "tools/sync_base_v94_reference_freshness.py"
      - ".github/workflows/sync-base-v94-reference-freshness.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Synchronize reference freshness authority
        run: python tools/sync_base_v94_reference_freshness.py
      - name: Verify reference freshness
        run: python tools/check_canonical_reference_freshness.py --root . --config .github/reference-freshness.json
      - name: Commit exact synchronization
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No synchronization required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reference-freshness.json '[기획서]/00_프로젝트_허브/SKILL_REGISTRY.json'
          git commit -m "fix: synchronize Base v9.4 reference freshness"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
