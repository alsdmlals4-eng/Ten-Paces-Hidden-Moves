name: Canonicalize Ten Manual Planning JSON

on:
  push:
    branches:
      - agent/2026-08-05-wrong-plan-rescue-stat-derived-design
    paths:
      - .github/workflows/canonicalize-ten-manual-json.yml
      - docs/planning-data/approved_20260806_ten_recognizable_martial_manuals_contract.json
      - docs/planning-data/approved_20260806_ten_manual_growth_budget_overlay_contract.json

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Canonicalize approved planning JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("docs/planning-data/approved_20260806_ten_recognizable_martial_manuals_contract.json"),
              Path("docs/planning-data/approved_20260806_ten_manual_growth_budget_overlay_contract.json"),
          ]
          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              path.write_text(
                  json.dumps(data, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
          PY
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            echo "Already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/planning-data/approved_20260806_ten_recognizable_martial_manuals_contract.json \
                  docs/planning-data/approved_20260806_ten_manual_growth_budget_overlay_contract.json
          git commit -m "style: canonicalize ten-manual planning json"
          git push origin HEAD:${{ github.ref_name }}
