name: Correct adapter authority hash

on:
  push:
    branches:
      - agent/repair-base-adapter-wave-a
    paths:
      - .github/workflows/fix-base-adapter-authority-hash.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Restore validator-resolved authority hash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("skills/PROJECT_BASE_ADAPTER.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["protected_baseline"]["policy_sha256"] = "ed848e62f3292d704f602e2976737005b77100c476c6947e57ff0bcb5a3b6e52"
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Commit adapter correction only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_BASE_ADAPTER.json
          git diff --cached --check
          git commit -m "fix: preserve protected policy authority hash"
          git push origin HEAD:agent/repair-base-adapter-wave-a
