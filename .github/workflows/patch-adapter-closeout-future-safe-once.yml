name: Patch Adapter Closeout Future Safe Once

on:
  push:
    branches:
      - fix/windows-android-adapter-postmerge-closeout
    paths:
      - .github/workflows/patch-adapter-closeout-future-safe-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/windows-android-adapter-postmerge-closeout
          fetch-depth: 0
      - name: Patch future-safe lifecycle consumers
        run: python tools/patch_adapter_closeout_future_safe_once.py
      - name: Commit future-safe updates
        shell: bash
        run: |
          set -euo pipefail
          git add tests/test_product_postmerge_and_platform_canon.py tests/test_project_governance.py tests/test_star7_star9_mastery_bonus_contract.py tests/test_windows_android_adapter_postmerge_closeout.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No future-safe changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: make adapter closeout future-safe'
          git push origin HEAD:fix/windows-android-adapter-postmerge-closeout
