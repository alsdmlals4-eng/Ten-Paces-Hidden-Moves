name: Validate Technique1 conditional Star5

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run Technique1 conditional Star5 regression tests
        run: python -m unittest tests.test_technique1_conditional_star5_contract -v

      - name: Validate Technique1 conditional Star5 contract
        run: python tools/check_technique1_conditional_star5_contract.py
