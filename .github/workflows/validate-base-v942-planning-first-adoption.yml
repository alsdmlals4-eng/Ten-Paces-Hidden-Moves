name: Validate Base v9.4.2 Planning First Adoption

on:
  pull_request:
    paths:
      - "skills/PROJECT_BASE_ADAPTER.json"
      - "skills/BASE_V9_ADAPTER.json"
      - "skills/PROJECT_BASE_SKILL_ADAPTER.json"
      - "skills/PROJECT_SKILL_SNAPSHOT.json"
      - "tests/test_base_v942_planning_first_adoption.py"
      - ".github/workflows/validate-base-v942-planning-first-adoption.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validate planning-first Base adoption
        run: python -m unittest tests.test_base_v942_planning_first_adoption -v
