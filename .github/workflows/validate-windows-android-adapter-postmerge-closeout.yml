name: Validate Windows Android Adapter Postmerge Closeout

on:
  push:
    branches:
      - fix/windows-android-adapter-postmerge-closeout
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run adapter postmerge closeout tests
        run: python -m unittest tests.test_windows_android_adapter_postmerge_closeout -v
