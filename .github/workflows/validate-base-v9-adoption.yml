name: Validate Base v9 adoption
on: [pull_request]
jobs:
  ci-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m unittest tests.test_base_v9_adoption
  adversarial-gate:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}" > changed.txt
          if grep -E '^(src/|scenes/|data/|assets/|addons/|project\.godot$)' changed.txt; then exit 1; fi
          test -f skills/BASE_V9_ADAPTER.json
