name: Validate Resource Saturation Internal Recovery

on:
  pull_request:
    paths:
      - "docs/decisions/2026-08-04_RESOURCE_SATURATION_INTERNAL_RECOVERY_DECISION.md"
      - "docs/decisions/2026-08-04_COMBAT_PRICING_INTERRUPTION_RECOVERY_DECISION.md"
      - "docs/planning-data/approved_20260804_combat_pricing_interruption_recovery_contract.json"
      - "docs/planning-data/approved_20260804_resource_saturation_internal_recovery_contract.json"
      - "docs/02_COMBAT_RULES.md"
      - "docs/CANON_LIFECYCLE_REGISTRY.md"
      - '\[기획서\]/00_프로젝트_허브/ACTIVE_CONTEXT.md'
      - "docs/04_ROADMAP.md"
      - "tools/check_resource_saturation_internal_recovery_contract.py"
      - "tests/test_resource_saturation_internal_recovery_contract.py"
      - ".github/workflows/resource-saturation-internal-recovery-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run resource saturation regression tests
        run: >-
          python -m unittest
          tests.test_resource_saturation_internal_recovery_contract
          tests.test_workflow_literal_path_filters
          -v
      - name: Validate resource saturation contract
        run: python tools/check_resource_saturation_internal_recovery_contract.py
