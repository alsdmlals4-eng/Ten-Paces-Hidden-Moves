name: Validate Ten Manual Growth Budget

on:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run ten-manual budget tests
        run: python -m unittest tests.test_ten_manual_growth_budget_overlay -v
      - name: Run ten-manual budget checker
        run: python tools/check_ten_manual_growth_budget_overlay.py
