name: Apply Ten Paces BCA v8
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "tools/_tmp_apply_bca_visual_sheet_v8.py"
      - ".github/workflows/_tmp_apply_bca_visual_sheet_v8.yml"
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/bca-visual-sheet-v8-adoption'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/bca-visual-sheet-v8-adoption
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply patch
        shell: bash
        run: |
          set +e
          python tools/_tmp_apply_bca_visual_sheet_v8.py > bca-patch-results.txt 2>&1
          status=$?
          cat bca-patch-results.txt
          exit "$status"
      - name: Validate
        run: |
          python -m py_compile tools/_tmp_apply_bca_visual_sheet_v8.py tests/test_bca_visual_sheet_adoption.py
          python -m unittest tests.test_bca_visual_sheet_adoption -v
          git diff --check
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-paces-bca-patch-results
          path: bca-patch-results.txt
          if-no-files-found: warn
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md docs/BASE_RULES_VERSION.md docs/PROJECT_GOOGLE_SHEET_WORKBOOK.md docs/GPT_IMAGE_GENERATION_AND_REVIEW_WORKFLOW.md docs/BCA_VISUAL_SHEET_ADOPTION_AUDIT.md '[기획서]/00_프로젝트_허브/SKILL_REGISTRY.json' skills/ux-ui-accessibility/combat-ux-and-accessibility/SKILL.md tests/test_bca_visual_sheet_adoption.py .github/workflows/validate-bca-visual-sheet-adoption.yml
          git diff --cached --check
          git commit -m "feat: adopt Base v8 visual and sheet workflow"
          git push origin HEAD:agent/bca-visual-sheet-v8-adoption
