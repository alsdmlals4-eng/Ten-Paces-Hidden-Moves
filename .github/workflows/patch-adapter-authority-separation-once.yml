name: Patch Adapter Authority Separation Once

on:
  push:
    branches:
      - planning/windows-android-adapter-architecture
    paths:
      - .github/workflows/patch-adapter-authority-separation-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out planning branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: planning/windows-android-adapter-architecture
          fetch-depth: 0
      - name: Patch immutable and mutable authorities
        run: python tools/patch_adapter_authority_separation_once.py
      - name: Commit authority separation
        shell: bash
        run: |
          set -euo pipefail
          git add docs/planning-data/approved_20260806_windows_android_adapter_architecture_contract.json tools/check_windows_android_adapter_architecture_contract.py tests/test_windows_android_adapter_architecture_contract.py tools/check_postmerge_canon_lifecycle.py docs/decisions/2026-08-06_WINDOWS_ANDROID_ADAPTER_ARCHITECTURE_DECISION.md
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No authority separation changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: separate immutable adapter Decision from mutable state'
          git push origin HEAD:planning/windows-android-adapter-architecture
