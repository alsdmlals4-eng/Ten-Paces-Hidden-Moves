name: Runtime Visual Capture Contract

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "tools/register_runtime_visual_capture.py"
      - "tools/prepare_runtime_visual_capture.py"
      - "tests/test_runtime_visual_capture_contract.py"
      - "docs/decisions/2026-09-01_RUNTIME_VISUAL_CAPTURE_EVIDENCE_POLICY_DECISION.md"
      - ".github/workflows/runtime-visual-capture-validation.yml"
  push:
    branches: [main]
    paths:
      - "tools/register_runtime_visual_capture.py"
      - "tools/prepare_runtime_visual_capture.py"
      - "tests/test_runtime_visual_capture_contract.py"
      - "docs/decisions/2026-09-01_RUNTIME_VISUAL_CAPTURE_EVIDENCE_POLICY_DECISION.md"
      - ".github/workflows/runtime-visual-capture-validation.yml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: runtime-visual-capture-contract
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba8058257ace6fc5755249368868f
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Check Python syntax
        run: >-
          python -m py_compile
          tools/register_runtime_visual_capture.py
          tools/prepare_runtime_visual_capture.py
          tests/test_runtime_visual_capture_contract.py
      - name: Run runtime visual capture behavior contract
        run: python -m unittest tests.test_runtime_visual_capture_contract -v
