name: HTML Blueprint
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Install document read dependencies
        run: |
          python -m pip install Pillow==12.3.0 reportlab==5.0.1
          command -v pdftoppm || (sudo apt-get update && sudo apt-get install -y poppler-utils)
      - name: Fetch observed candidate without adopting product changes
        run: |
          candidate=$(python -c 'import json; print(json.load(open("docs/blueprint/HTML_SOURCE_OBSERVATIONS.json"))["prs"]["342"]["headRefOid"])')
          git fetch origin "$candidate"
      - name: Verify publication, preservation and preview boundaries
        run: python -m unittest tests.test_html_blueprint tests.test_html_blueprint_preview tests.test_html_blueprint_diagrams tests.test_html_blueprint_publication tests.test_html_blueprint_experience tests.test_html_blueprint_inspection tests.test_blueprint_launcher tests.test_blueprint_design_tables
      - name: Build complete derived view
        run: python tools/build_html_blueprint.py
      - name: Check all display views and local links
        run: node tools/check_html_blueprint_ui.cjs
