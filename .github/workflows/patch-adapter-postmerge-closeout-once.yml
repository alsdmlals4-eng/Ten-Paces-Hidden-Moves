name: Patch Adapter Postmerge Closeout Once

on:
  push:
    branches:
      - fix/windows-android-adapter-postmerge-closeout
    paths:
      - .github/workflows/patch-adapter-postmerge-closeout-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out closeout branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/windows-android-adapter-postmerge-closeout
          fetch-depth: 0
      - name: Patch postmerge canon
        run: python tools/patch_adapter_postmerge_closeout_once.py
      - name: Commit closeout changes
        shell: bash
        run: |
          set -euo pipefail
          git add docs/planning-data/current_operating_state.json '[기획서]/00_프로젝트_허브/ACTIVE_CONTEXT.md' '[기획서]/00_프로젝트_허브/ROADMAP.md' docs/04_ROADMAP.md tests/test_product_postmerge_and_platform_canon.py tests/test_project_governance.py tests/test_star7_star9_mastery_bonus_contract.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No closeout changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close Windows Android adapter planning lifecycle'
          git push origin HEAD:fix/windows-android-adapter-postmerge-closeout
