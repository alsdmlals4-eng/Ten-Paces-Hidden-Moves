name: Apply Project GDD Sheet Sync Once

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/apply_project_gdd_sheet_sync_once.py"
      - ".github/workflows/apply-project-gdd-sheet-sync-once.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ten-paces-gdd-sheet-sync-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply configured Sheet contract
        run: python tools/apply_project_gdd_sheet_sync_once.py
      - name: Validate generated contract
        shell: bash
        run: |
          python -m py_compile tests/test_bca_visual_sheet_adoption.py
          python -m unittest tests.test_bca_visual_sheet_adoption -v
          git diff --check
      - name: Commit generated changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AGENTS.md docs/BASE_RULES_VERSION.md \
            docs/BCA_VISUAL_SHEET_ADOPTION_AUDIT.md \
            docs/GPT_IMAGE_GENERATION_AND_REVIEW_WORKFLOW.md \
            docs/PROJECT_GOOGLE_SHEET_WORKBOOK.md \
            '[기획서]/00_프로젝트_허브/SKILL_REGISTRY.json' \
            tests/test_bca_visual_sheet_adoption.py
          git commit -m "docs: configure project GDD Google Sheet"
          git push origin HEAD:${{ github.event.pull_request.head.ref || github.ref_name }}
