name: Apply Project GDD Sheet Sync Once
on:
  pull_request:
    branches: [main]
    paths: ["tools/fix_core_expected_ids_once.py", ".github/workflows/apply-project-gdd-sheet-sync-once.yml"]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python tools/fix_core_expected_ids_once.py
      - run: |
          python -m json.tool .github/reference-freshness.json >/dev/null
          python tools/check_project_operating_system.py --root . --config .github/documentation-governance.json
          git diff --check
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/reference-freshness.json
          git commit -m "docs: keep extension Skills outside core expectation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
