name: Validate Windows Android Adapter Architecture

on:
  push:
    branches:
      - planning/windows-android-adapter-architecture
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Run adapter architecture regression tests
        run: python -m unittest tests.test_windows_android_adapter_architecture_contract -v
