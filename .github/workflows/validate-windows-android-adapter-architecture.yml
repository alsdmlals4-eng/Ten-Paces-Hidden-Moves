name: Validate Windows Android Adapter Architecture

on:
  push:
    branches:
      - planning/windows-android-adapter-architecture
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Run adapter architecture regression tests
        run: python -m unittest tests.test_windows_android_adapter_architecture_contract -v
      - name: Validate adapter architecture contract
        run: python tools/check_windows_android_adapter_architecture_contract.py
