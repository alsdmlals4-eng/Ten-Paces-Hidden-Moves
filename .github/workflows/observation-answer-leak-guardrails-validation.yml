name: Validate Observation Answer Leak Guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-observation-answer-leak-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run observation guardrail regression tests
        run: python -m unittest tests.test_observation_answer_leak_guardrails_contract -v

      - name: Validate observation guardrail contract
        run: python tools/check_observation_answer_leak_guardrails_contract.py
