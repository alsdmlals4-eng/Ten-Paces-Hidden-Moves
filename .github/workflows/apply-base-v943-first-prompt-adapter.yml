name: Apply Base v9.4.3 First Prompt Adapter Once

on:
  push:
    branches: ["agent/base-v9-4-3-first-prompt-adapter"]
    paths:
      - "tools/apply_base_v943_first_prompt_adapter.py"
      - ".github/workflows/apply-base-v943-first-prompt-adapter.yml"
permissions:
  contents: write
jobs:
  patch-adapter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "agent/base-v9-4-3-first-prompt-adapter"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/apply_base_v943_first_prompt_adapter.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_BASE_ADAPTER.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: pin Base v9.4.3 first-prompt adapter"
          git push origin HEAD:agent/base-v9-4-3-first-prompt-adapter
