name: Temporary Base Shared Adapter Wave

on:
  push:
    branches:
      - agent/base-shared-external-ai-adapter-20260802

permissions:
  contents: write

jobs:
  patch-adapter:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply project-specific shared adapter update
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          root = Path(".")
          adapter_path = root / "skills/PROJECT_BASE_ADAPTER.json"
          adapter = json.loads(adapter_path.read_text(encoding="utf-8"))
          skill_id = "orchestrating-deepseek-worktrees"

          routes = adapter.setdefault("routing", {}).setdefault("base_routes", [])
          if routes and all(isinstance(item, str) for item in routes):
              if skill_id not in routes:
                  routes.append(skill_id)
              routes.sort()
          else:
              route_ids = {
                  item.get("skill_id")
                  for item in routes
                  if isinstance(item, dict)
              }
              if skill_id not in route_ids:
                  routes.append({
                      "route_id": skill_id,
                      "skill_id": skill_id,
                      "status": "ACTIVE",
                  })
              routes.sort(
                  key=lambda item: item if isinstance(item, str) else item.get("skill_id", "")
              )

          contract = {
              "base_contract_source": "skills/orchestrating-deepseek-worktrees/SKILL.md",
              "work_package_source": "templates/ai/DEEPSEEK_WORK_PACKAGE.md",
              "worktree_parent": ".worktrees/",
              "task_branch_prefix": "ai/deepseek-",
              "draft_root": "drafts/external-ai/",
              "allowed_write_roots": ["drafts/external-ai/**"],
              "protected_paths_source": "skills/PROJECT_BASE_ADAPTER.json#/protected_paths",
              "result_state": "REVIEW_PENDING",
              "integration_policy": "LOCAL_REVIEW_REQUIRED_BEFORE_CANON",
              "base_validator_adoption": "DEFER_UNTIL_NEXT_RELEASED_BASE_PIN",
          }

          if adapter.get("project", {}).get("repository") == "alsdmlals4-eng/GRIMOIRE-":
              adapter.setdefault("base_v94_contract", {})["external_ai_worktree"] = contract
              adapter.setdefault("validation", {})[
                  "base_shared_external_ai_adapter"
              ] = "REQUIRED_ON_PULL_REQUEST"
          else:
              adapter.setdefault("shared_overrides", {})[skill_id] = contract
              validators = adapter.setdefault("validators", [])
              command = "python tests/test_base_shared_external_ai_adapter.py"
              if validators and all(isinstance(item, dict) for item in validators):
                  existing = {
                      item.get("command")
                      for item in validators
                      if isinstance(item, dict)
                  }
                  if command not in existing:
                      validators.append({
                          "command": command,
                          "status": "REQUIRED_ON_PULL_REQUEST",
                          "evidence_commit": None,
                      })
              elif command not in validators:
                  validators.append(command)

          gitignore_path = root / ".gitignore"
          gitignore = gitignore_path.read_text(encoding="utf-8") if gitignore_path.exists() else ""
          lines = [line.rstrip() for line in gitignore.splitlines()]
          if ".worktrees/" not in lines:
              if gitignore and not gitignore.endswith("\n"):
                  gitignore += "\n"
              gitignore += ".worktrees/\n"
              gitignore_path.write_text(gitignore, encoding="utf-8")

          test_source = r'''from __future__ import annotations

import json
import subprocess
import unittest
from pathlib import Path


ROOT = Path(__file__).resolve().parents[1]
ADAPTER_PATH = ROOT / "skills/PROJECT_BASE_ADAPTER.json"
SKILL_ID = "orchestrating-deepseek-worktrees"
BASE_RELEASE_COMMIT = "a728712cb776ec98f4875914a580fcf7d0156593"
BASE_REGISTRY_SHA256 = "693a0dff3f054ecdd653079909e044211473838e73dd9aff07734d1ce5694c59"


def load_adapter() -> dict:
    return json.loads(ADAPTER_PATH.read_text(encoding="utf-8"))


def route_ids(adapter: dict) -> set[str]:
    values = set()
    for route in adapter["routing"]["base_routes"]:
        if isinstance(route, str):
            values.add(route)
        elif isinstance(route, dict):
            if route.get("status") == "ACTIVE":
                values.add(route.get("skill_id"))
    return values


def external_ai_override(adapter: dict) -> dict:
    shared = adapter.get("shared_overrides", {}).get(SKILL_ID)
    if isinstance(shared, dict):
        return shared
    grimoire = adapter.get("base_v94_contract", {}).get("external_ai_worktree")
    if isinstance(grimoire, dict):
        return grimoire
    return {}


class BaseSharedExternalAIAdapterTests(unittest.TestCase):
    def test_preserves_released_base_identity(self) -> None:
        adapter = load_adapter()
        self.assertEqual("9.4.0", adapter["base_release"]["version"])
        self.assertEqual(BASE_RELEASE_COMMIT, adapter["base_release"]["release_commit"])
        registry_hash = (
            adapter.get("skill_registry", {}).get("base", {}).get("sha256")
            or adapter.get("base_release", {}).get("registry_sha256")
        )
        self.assertEqual(BASE_REGISTRY_SHA256, registry_hash)

    def test_routes_external_ai_worktree_skill_without_copying_body(self) -> None:
        adapter = load_adapter()
        self.assertIn(SKILL_ID, route_ids(adapter))
        self.assertFalse(
            (ROOT / "skills/orchestrating-deepseek-worktrees/SKILL.md").exists()
        )

    def test_binds_project_isolation_and_review_pending_policy(self) -> None:
        adapter = load_adapter()
        override = external_ai_override(adapter)
        self.assertEqual(".worktrees/", override["worktree_parent"])
        self.assertEqual("ai/deepseek-", override["task_branch_prefix"])
        self.assertEqual("drafts/external-ai/", override["draft_root"])
        self.assertEqual(["drafts/external-ai/**"], override["allowed_write_roots"])
        self.assertEqual(
            "skills/PROJECT_BASE_ADAPTER.json#/protected_paths",
            override["protected_paths_source"],
        )
        self.assertEqual("REVIEW_PENDING", override["result_state"])
        self.assertEqual(
            "LOCAL_REVIEW_REQUIRED_BEFORE_CANON",
            override["integration_policy"],
        )
        self.assertEqual(
            "DEFER_UNTIL_NEXT_RELEASED_BASE_PIN",
            override["base_validator_adoption"],
        )
        self.assertTrue(adapter["protected_paths"])

    def test_worktree_parent_is_ignored_by_git(self) -> None:
        result = subprocess.run(
            ["git", "check-ignore", "-q", ".worktrees/"],
            cwd=ROOT,
            check=False,
        )
        self.assertEqual(0, result.returncode)

    def test_project_validation_discovers_adapter_test(self) -> None:
        adapter = load_adapter()
        command = "python tests/test_base_shared_external_ai_adapter.py"
        validators = adapter.get("validators", [])
        commands = {
            item if isinstance(item, str) else item.get("command")
            for item in validators
        }
        validation = adapter.get("validation", {})
        self.assertTrue(
            command in commands
            or validation.get("base_shared_external_ai_adapter")
            == "REQUIRED_ON_PULL_REQUEST"
        )


if __name__ == "__main__":
    unittest.main()
'''
          test_path = root / "tests/test_base_shared_external_ai_adapter.py"
          test_path.parent.mkdir(parents=True, exist_ok=True)
          test_path.write_text(test_source, encoding="utf-8")

          adapter_path.write_text(
              json.dumps(adapter, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Commit adapter wave and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skills/PROJECT_BASE_ADAPTER.json tests/test_base_shared_external_ai_adapter.py .gitignore
          git rm .github/workflows/tmp-base-shared-adapter-wave.yml
          git commit -m "chore: update Base shared external AI adapter"
          git push origin "HEAD:${GITHUB_REF_NAME}"
