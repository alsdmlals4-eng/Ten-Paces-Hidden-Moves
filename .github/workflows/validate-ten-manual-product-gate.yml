name: Validate Ten Manual Product Gate

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "data/**"
      - "src/**"
      - "scenes/**"
      - "assets/**"
      - "addons/**"
      - "scripts/windows/run_ten_manual_product_validation.ps1"
      - "tools/validate_ten_manual_product_gate.py"
      - "docs/planning-data/approved_20260806_ten_manual_product_validation_gate_contract.json"
      - "tests/test_ten_manual_product_gate.py"
      - "tests/test_visual_continuation.py"
      - "tests/verify_motion_roster_integration.gd"
      - "tests/verify_*layout.gd"
      - "tests/verify_character_pose_animation.gd"
      - "tests/verify_combat_impact_camera.gd"
      - "tests/verify_compact_action_detail.gd"
      - "tests/verify_execution_visual_contract.gd"
      - "tests/verify_clash_alpha_vfx.gd"
      - "tests/verify_clash_recovery_readability.gd"
      - "tests/verify_wuxia_paper_surfaces.gd"
      - "tests/verify_compact_timing_labels.gd"
      - "tests/verify_preparation_art_fill.gd"
      - "tests/verify_wuxia_sound_envelopes.gd"
      - "tests/verify_flat_martial_grid.gd"
      - "tests/verify_portrait_hud.gd"
      - "tests/verify_pose_cache_ready.gd"
      - "tests/verify_preparation_columns.gd"
      - "tests/verify_visual_distance_spacing.gd"
      - "tests/verify_dogyeom_status_portrait.gd"
      - "tests/verify_ten_manual_product_gate.gd"
      - "tests/verify_bimu_constraint_model.gd"
      - "tests/verify_run_save_store.gd"
      - "tests/verify_game_menu.gd"
      - "tests/verify_vertical_slice_completion_summary.gd"
      - "tests/verify_presentation_preferences.gd"
      - "tests/verify_presentation_preferences_runtime.gd"
      - "tests/test_presentation_preferences_restart.py"
      - "tests/verify_run_save_cache.gd"
      - "tests/verify_martial_actor_binding.gd"
      - "tests/verify_martial_effect_pipeline.gd"
      - "tests/fixtures/pre_publication_save_v1_actor_shared.json"
      - "tests/verify_combat_checkpoint_resume.gd"
      - "tests/test_durable_save_contract.py"
      - "tests/verify_durable_run_continue.gd"
      - "tests/durable_continue_process.gd"
      - "tests/verify_save_entry_isolation.gd"
      - "tests/verify_bimu_constraint_runtime.gd"
      - "tests/verify_bimu_constraint_ui.gd"
      - "tests/verify_ten_manual_product_viewports.gd"
      - "tests/verify_combat_keyboard_accessibility.gd"
      - "tests/verify_combat_focus_order.gd"
      - "tests/verify_combat_layout_accessibility.gd"
      - "tests/verify_combat_action_selection_integration.gd"
      - "tests/verify_combat_outcome_feedback.gd"
      - "tests/verify_actor_ultimate_presentation.gd"
      - "tests/verify_frontal_duel_screen_partition.gd"
      - "tests/verify_combat_action_reveal.gd"
      - "tests/probe_native_ten_duel_campaign.gd"
      - "tests/probe_sequential_ten_duel_campaign.gd"
      - ".github/workflows/validate-ten-manual-product-gate.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run product gate validator tests
        run: python -m unittest tests.test_ten_manual_product_gate -v
      - name: Validate product gate contract
        run: python tools/validate_ten_manual_product_gate.py --root .

  automated-product-evidence:
    runs-on: ubuntu-latest
    # Full presentation regressions plus the ordinary-speed native campaign.
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false
      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Verify frontal duel screen partition
        run: godot --headless --path . --script res://tests/verify_frontal_duel_screen_partition.gd
      - name: Verify approved visual continuation contracts
        env:
          GODOT_BIN: godot
        run: python -m unittest tests.test_visual_continuation -v
      - name: Verify combat action reveal
        run: godot --headless --path . --script res://tests/verify_combat_action_reveal.gd
      - name: Verify shared terminal outcome feedback
        run: godot --headless --path . --script res://tests/verify_combat_outcome_feedback.gd
      - name: Verify actor-owned ultimate presentation
        run: godot --headless --path . --script res://tests/verify_actor_ultimate_presentation.gd
      - name: Verify fifty ten-manual product scenarios
        run: godot --headless --path . --script res://tests/verify_ten_manual_product_gate.gd
      - name: Verify product viewport matrix
        run: godot --headless --path . --script res://tests/verify_ten_manual_product_viewports.gd
      - name: Verify keyboard accessibility
        run: godot --headless --path . --script res://tests/verify_combat_keyboard_accessibility.gd
      - name: Verify inline combat results
        run: godot --headless --path . --script res://tests/verify_inline_combat_results.gd
      - name: Verify focus order
        run: godot --headless --path . --script res://tests/verify_combat_focus_order.gd
      - name: Verify layout accessibility
        run: godot --headless --path . --script res://tests/verify_combat_layout_accessibility.gd
      - name: Verify action selection integration
        run: godot --headless --path . --script res://tests/verify_combat_action_selection_integration.gd
      - name: Verify sequential public-policy ten-duel campaign
        run: godot --headless --path . --script res://tests/probe_sequential_ten_duel_campaign.gd
      - name: Verify native-input ten-duel campaign
        run: godot --headless --path . --script res://tests/probe_native_ten_duel_campaign.gd -- --run-save-dir=user://ci-native-durable-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify bimu constraint catalog and model
        run: godot --headless --path . --script res://tests/verify_bimu_constraint_model.gd
      - name: Verify bimu constraint frozen receipt and engine enforcement
        run: godot --headless --path . --script res://tests/verify_bimu_constraint_runtime.gd
      - name: Verify bimu native selection and sealed action UI
        run: godot --headless --path . --script res://tests/verify_bimu_constraint_ui.gd
      - name: Verify verify_variable_opponent_roster
        run: godot --headless --path . --script res://tests/verify_variable_opponent_roster.gd
      - name: Verify verify_variable_run_state
        run: godot --headless --path . --script res://tests/verify_variable_run_state.gd
      - name: Verify verify_variable_recon
        run: godot --headless --path . --script res://tests/verify_variable_recon.gd
      - name: Verify verify_variable_enemy_information
        run: godot --headless --path . --script res://tests/verify_variable_enemy_information.gd
      - name: Verify verify_variable_save_compat
        run: godot --headless --path . --script res://tests/verify_variable_save_compat.gd
      - name: Verify verify_variable_combat_codec
        run: godot --headless --path . --script res://tests/verify_variable_combat_codec.gd
      - name: Verify verify_variable_shell
        run: godot --headless --path . --script res://tests/verify_variable_shell.gd
      - name: Verify verify_approved_blueprint_art
        run: godot --headless --path . --script res://tests/verify_approved_blueprint_art.gd
      - name: Verify verify_approved_manual_art_consumer
        run: godot --headless --path . --script res://tests/verify_approved_manual_art_consumer.gd
      - name: Verify campaign state boundaries
        run: godot --headless --path . --script res://tests/verify_ten_duel_campaign.gd
      - name: Verify campaign failure and retry
        run: godot --headless --path . --script res://tests/verify_vertical_slice_failure_retry.gd
      - name: Verify durable run snapshot and recoverable local store
        run: godot --headless --path . --script res://tests/verify_run_save_store.gd
      - name: Verify independent presentation preferences and failure fallback
        run: godot --headless --path . --script res://tests/verify_presentation_preferences.gd
      - name: Verify native preference input and independent process restart
        env:
          GODOT_BIN: godot
        run: python tests/test_presentation_preferences_restart.py
      - name: Verify canonical and scrollable ten-duel completion history
        run: godot --headless --path . --script res://tests/verify_vertical_slice_completion_summary.gd
      - name: Verify optional game menu, native focus and settings boundaries
        run: godot --headless --path . --script res://tests/verify_game_menu.gd
      - name: Verify bounded raw-byte save validation cache
        run: godot --headless --path . --script res://tests/verify_run_save_cache.gd
      - name: Verify actor-owned martial execution and preserved old save identity
        run: godot --headless --path . --script res://tests/verify_martial_actor_binding.gd
      - name: Verify canonical stat references and atomic martial effect failures
        run: godot --headless --path . --script res://tests/verify_martial_effect_pipeline.gd
      - name: Verify deterministic combat checkpoint resume
        run: godot --headless --path . --script res://tests/verify_combat_checkpoint_resume.gd
      - name: Verify actual title continuation and transactional recovery
        run: godot --headless --path . --script res://tests/verify_durable_run_continue.gd
      - name: Verify rendered preparation summaries
        run: godot --headless --path . --script res://tests/verify_action_card_summary.gd
      - name: Verify rest and route presentation transitions
        run: godot --headless --path . --script res://tests/verify_jianghu_rest_presentation.gd
      - name: Verify shared atlas presentation and sound cache
        run: godot --headless --path . --script res://tests/verify_atlas_presentation_successor.gd
      - name: Upload automated product evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ten-manual-automated-product-evidence-${{ github.sha }}
          path: artifacts/ten-manual-product-validation
          if-no-files-found: warn
          retention-days: 7

  windows-product-evidence:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
      TEN_MANUAL_EVIDENCE_DIR: ${{ github.workspace }}\artifacts\ten-manual-product-validation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up Godot 4.7.1 and export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Import and parse project
        shell: pwsh
        run: |
          $godot = (Get-Command godot).Source
          $process = Start-Process -FilePath $godot -ArgumentList @('--headless', '--editor', '--path', '.', '--quit') -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Godot import failed with exit code $($process.ExitCode)" }
      - name: Export Windows product build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          $godot = (Get-Command godot).Source
          $arguments = @('--headless', '--path', '.', '--export-release', '"Windows Desktop Product Validation"', '"build/windows/TenPacesHiddenMoves.exe"')
          $process = Start-Process -FilePath $godot -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Godot export failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath "build/windows/TenPacesHiddenMoves.exe")) {
            throw "Godot export did not create build/windows/TenPacesHiddenMoves.exe"
          }
      - name: Run exported Windows product validation
        shell: pwsh
        run: |
          ./scripts/windows/run_ten_manual_product_validation.ps1 `
            -Executable "build/windows/TenPacesHiddenMoves.exe" `
            -HeadSha "$env:HEAD_SHA" `
            -OutputDirectory "$env:TEN_MANUAL_EVIDENCE_DIR"
      - name: Validate Windows evidence
        shell: pwsh
        run: |
          python tools/validate_ten_manual_product_gate.py `
            --root . `
            --expected-sha "$env:HEAD_SHA" `
            --evidence "artifacts/ten-manual-product-validation/product_validation_evidence.json"
      - name: Upload Windows product build and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ten-manual-product-validation-${{ env.HEAD_SHA }}
          path: |
            build/windows
            artifacts/ten-manual-product-validation
          if-no-files-found: warn
          retention-days: 14
