name: Validate Ten Manual Product Gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product-gate-contract-red:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run product gate validator tests
        run: python -m unittest tests.test_ten_manual_product_gate -v
      - name: Validate product gate contract
        run: python tools/validate_ten_manual_product_gate.py --root . --expected-sha "${{ github.sha }}"
