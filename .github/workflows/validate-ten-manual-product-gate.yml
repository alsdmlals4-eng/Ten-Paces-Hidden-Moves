name: Validate Ten Manual Product Gate

on:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "data/**"
      - "src/**"
      - "scenes/**"
      - "assets/**"
      - "addons/**"
      - "scripts/windows/**"
      - "tools/validate_ten_manual_product_gate.py"
      - "tests/test_ten_manual_product_gate.py"
      - "tests/verify_ten_manual_product_gate.gd"
      - "tests/verify_ten_manual_product_viewports.gd"
      - "tests/verify_combat_keyboard_accessibility.gd"
      - "tests/verify_combat_focus_order.gd"
      - "tests/verify_combat_layout_accessibility.gd"
      - "tests/verify_combat_action_selection_integration.gd"
      - ".github/workflows/validate-ten-manual-product-gate.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  product-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run product gate validator tests
        run: python -m unittest tests.test_ten_manual_product_gate -v
      - name: Validate product gate contract
        run: python tools/validate_ten_manual_product_gate.py --root .

  automated-product-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false
      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false
      - name: Import and parse project
        run: godot --headless --editor --path . --quit
      - name: Verify fifty ten-manual product scenarios
        run: godot --headless --path . --script res://tests/verify_ten_manual_product_gate.gd
      - name: Verify product viewport matrix
        run: godot --headless --path . --script res://tests/verify_ten_manual_product_viewports.gd
      - name: Verify keyboard accessibility
        run: godot --headless --path . --script res://tests/verify_combat_keyboard_accessibility.gd
      - name: Verify focus order
        run: godot --headless --path . --script res://tests/verify_combat_focus_order.gd
      - name: Verify layout accessibility
        run: godot --headless --path . --script res://tests/verify_combat_layout_accessibility.gd
      - name: Verify action selection integration
        run: godot --headless --path . --script res://tests/verify_combat_action_selection_integration.gd
      - name: Upload automated product evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ten-manual-automated-product-evidence-${{ github.sha }}
          path: artifacts/ten-manual-product-validation
          if-no-files-found: warn
          retention-days: 7

  windows-product-evidence:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number || 0 }}
      TEN_MANUAL_EVIDENCE_DIR: ${{ github.workspace }}\artifacts\ten-manual-product-validation
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          show-progress: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Set up Godot 4.7.1 and export templates
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: true
      - name: Import and parse project
        shell: pwsh
        run: |
          $godot = (Get-Command godot).Source
          $process = Start-Process -FilePath $godot -ArgumentList @('--headless', '--editor', '--path', '.', '--quit') -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Godot import failed with exit code $($process.ExitCode)" }
      - name: Export Windows product build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          $godot = (Get-Command godot).Source
          $arguments = @('--headless', '--path', '.', '--export-release', '"Windows Desktop Product Validation"', '"build/windows/TenPacesHiddenMoves.exe"')
          $process = Start-Process -FilePath $godot -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          if ($process.ExitCode -ne 0) { throw "Godot export failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path -LiteralPath "build/windows/TenPacesHiddenMoves.exe")) {
            throw "Godot export did not create build/windows/TenPacesHiddenMoves.exe"
          }
      - name: Run exported Windows product validation
        shell: pwsh
        run: |
          ./scripts/windows/run_ten_manual_product_validation.ps1 `
            -Executable "build/windows/TenPacesHiddenMoves.exe" `
            -HeadSha "$env:HEAD_SHA" `
            -OutputDirectory "$env:TEN_MANUAL_EVIDENCE_DIR"
      - name: Validate Windows evidence
        shell: pwsh
        run: |
          python tools/validate_ten_manual_product_gate.py `
            --root . `
            --expected-sha "$env:HEAD_SHA" `
            --evidence "artifacts/ten-manual-product-validation/product_validation_evidence.json"
      - name: Upload Windows product build and evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ten-manual-product-validation-${{ env.HEAD_SHA }}
          path: |
            build/windows
            artifacts/ten-manual-product-validation
          if-no-files-found: warn
          retention-days: 14
