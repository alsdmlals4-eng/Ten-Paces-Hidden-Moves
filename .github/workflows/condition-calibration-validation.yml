name: Validate Condition Calibration

on:
  pull_request:
    paths:
      - "docs/decisions/2026-08-05_CONDITION_CALIBRATION_DECISION.md"
      - "docs/decisions/2026-08-04_TECHNIQUE1_CONDITIONAL_REWORK_STAR5_DECISION.md"
      - "docs/planning-data/approved_20260804_technique1_conditional_rework_star5_contract.json"
      - "docs/planning-data/approved_20260805_condition_calibration_contract.json"
      - "docs/02_COMBAT_RULES.md"
      - "docs/CANON_LIFECYCLE_REGISTRY.md"
      - '\[기획서\]/00_프로젝트_허브/ACTIVE_CONTEXT.md'
      - "docs/04_ROADMAP.md"
      - "tools/check_condition_calibration_contract.py"
      - "tests/test_condition_calibration_contract.py"
      - ".github/workflows/condition-calibration-validation.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Run condition calibration regression tests
        run: >-
          python -m unittest
          tests.test_condition_calibration_contract
          tests.test_workflow_literal_path_filters
          -v
      - name: Validate condition calibration contract
        run: python tools/check_condition_calibration_contract.py
