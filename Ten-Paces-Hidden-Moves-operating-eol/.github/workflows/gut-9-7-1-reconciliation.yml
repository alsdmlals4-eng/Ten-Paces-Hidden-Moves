name: GUT 9.7.1 Reconciliation

on:
  pull_request:
    paths:
      - ".github/workflows/gut-9-7-1-reconciliation.yml"
      - ".gutconfig.json"
      - "addons/gut/**"
      - "tests/gut/**"
      - "tests/test_gut_9_7_1_reconciliation.py"
      - "tests/test_gut_9_7_1_observed_variance_manifest.py"
      - "tools/check_gut_9_7_1_reconciliation.py"
      - "docs/decisions/2026-08-07_GUT_9_7_1_RECONCILIATION_VALIDATION_DECISION.md"
      - "docs/planning-data/approved_20260807_gut_9_7_1_reconciliation.json"
      - "docs/implementation/BUILD_APPROVAL_2026-08-08.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gut-reconciliation-exact-head:
    name: gut-reconciliation-exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out exact project PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: project
          show-progress: false

      - name: Require exact PR head
        if: github.event_name == 'pull_request'
        working-directory: project
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Check out official GUT v9.7.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: bitwes/Gut
          ref: v9.7.1
          path: gut-upstream
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Run reconciliation contract tests
        working-directory: project
        run: >-
          python -m unittest
          tests.test_gut_9_7_1_reconciliation
          tests.test_gut_9_7_1_observed_variance_manifest
          -v

      - name: Compare installed GUT tree to official tag
        working-directory: project
        run: >-
          python tools/check_gut_9_7_1_reconciliation.py compare-tree
          --project-addon addons/gut
          --upstream-addon ../gut-upstream/addons/gut
          --report build/gut-reconciliation/tree-report.json

      - name: Set up Godot 4.7.1
        uses: chickensoft-games/setup-godot@f166999204a4f2722c6fe042fbaa3b3ea0d9c789
        with:
          version: 4.7.1
          use-dotnet: false
          include-templates: false

      - name: Import and parse project
        working-directory: project
        run: godot --headless --editor --path . --quit

      - name: Require clean tracked tree after import
        working-directory: project
        run: git diff --exit-code

      - name: Hash production scope before GUT
        working-directory: project
        run: >-
          python tools/check_gut_9_7_1_reconciliation.py hash-production
          --root .
          --output build/gut-reconciliation/production-before.json

      - name: Prepare JUnit directory
        working-directory: project
        run: mkdir -p build/test-results

      - name: Run GUT project tests
        working-directory: project
        run: >-
          godot --headless --path . --script res://addons/gut/gut_cmdln.gd
          -gconfig=res://.gutconfig.json

      - name: Require JUnit output
        if: always()
        working-directory: project
        run: test -f build/test-results/gut.xml

      - name: Hash production scope after GUT
        if: always()
        working-directory: project
        run: >-
          python tools/check_gut_9_7_1_reconciliation.py hash-production
          --root .
          --output build/gut-reconciliation/production-after.json

      - name: Verify production hash unchanged
        if: always()
        working-directory: project
        run: >-
          python tools/check_gut_9_7_1_reconciliation.py verify-hash
          --before build/gut-reconciliation/production-before.json
          --after build/gut-reconciliation/production-after.json

      - name: Require clean tracked tree after GUT
        if: always()
        working-directory: project
        run: git diff --exit-code

      - name: Upload reconciliation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gut-reconciliation-${{ github.run_id }}
          path: |
            project/build/gut-reconciliation/*.json
            project/build/test-results/gut.xml
            gut-upstream/addons/gut/source_code_pro.fnt
          if-no-files-found: error
          retention-days: 14
